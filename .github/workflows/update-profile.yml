name: Update profile card

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/update_profile.py
      - assets/portrait.txt
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh stats and render themes
        run: python scripts/update_profile.py --refresh
        env:
          GITHUB_TOKEN: ${{ secrets.ZAI_TOKEN || github.token }}
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dark_mode.svg light_mode.svg assets/profile-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update profile card stats"
            git push
          fi
